name: Keepalive

# 公開リポジトリは60日間コミットが無いと schedule の定期実行が自動停止する
# （2026-10-13 に check-live / fetch-profiles が disabled_inactivity で止まった）。
# 毎月1日に空コミットを入れてリポジトリを更新状態に保ち、念のため2本を有効化し直す。
on:
  schedule:
    - cron: '0 0 1 * *'  # 毎月1日 9:00 JST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Empty commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --allow-empty -m "keepalive: $(date -u +%Y-%m-%d)"
          git push
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable check-live.yml -R "$GITHUB_REPOSITORY"
          gh workflow enable fetch-profiles.yml -R "$GITHUB_REPOSITORY"
